services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ridespot
      POSTGRES_USER: ridespot
      POSTGRES_PASSWORD: ridespot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
