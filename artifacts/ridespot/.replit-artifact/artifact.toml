kind = "web"
previewPath = "/"
title = "RideSpot"
version = "1.0.0"
id = "artifacts/ridespot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21550

[services.development]
run = "pnpm --filter @workspace/ridespot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ridespot", "run", "build" ]
publicDir = "artifacts/ridespot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21550"
BASE_PATH = "/"
